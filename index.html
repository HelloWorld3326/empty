<title>Ontology 演练场 · 建模与运行</title>

<style>
/* ============================================================
   TOKENS
   冷色 = 类型与数据  ·  琥珀 = 写入（无论写的是 schema 还是实例）
   ============================================================ */
:root{
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;

  --bg:#EAEFF2;  --panel:#FFFFFF;  --panel-2:#F4F8FA;  --sunken:#E3EAEE;
  --line:#D2DDE3; --line-soft:#E2EAEE;
  --text:#131E25; --text-2:#3C5058; --muted:#697E88;

  --write:#B96A12; --write-bg:#FBF1E3; --write-line:#E6C596; --write-fg:#FFFFFF;
  --ok:#2C7A5B; --info:#2F6BA8; --bad:#AF4029; --neutral:#697E88;

  --p0:#3C74B8; --p1:#6E5FC0; --p2:#2E8A72; --p3:#5C7688;
  --p4:#AF4E68; --p5:#6F7F2C; --p6:#2F8FA8; --p7:#8A5A9E;

  --r:4px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1317; --panel:#141C21; --panel-2:#19232A; --sunken:#101920;
    --line:#26333A; --line-soft:#1E2930;
    --text:#DCE6EA; --text-2:#A6B8C0; --muted:#7A8D98;
    --write:#E5943F; --write-bg:#271D14; --write-line:#563F1E; --write-fg:#1B1207;
    --ok:#57BC92; --info:#6BA3E0; --bad:#DF7259; --neutral:#7A8D98;
    --p0:#6BA3E0; --p1:#9B8CEA; --p2:#4FB99B; --p3:#8AA5B8;
    --p4:#DE7B94; --p5:#A9BC5C; --p6:#55B4CE; --p7:#B98BCC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1317; --panel:#141C21; --panel-2:#19232A; --sunken:#101920;
  --line:#26333A; --line-soft:#1E2930;
  --text:#DCE6EA; --text-2:#A6B8C0; --muted:#7A8D98;
  --write:#E5943F; --write-bg:#271D14; --write-line:#563F1E; --write-fg:#1B1207;
  --ok:#57BC92; --info:#6BA3E0; --bad:#DF7259; --neutral:#7A8D98;
  --p0:#6BA3E0; --p1:#9B8CEA; --p2:#4FB99B; --p3:#8AA5B8;
  --p4:#DE7B94; --p5:#A9BC5C; --p6:#55B4CE; --p7:#B98BCC;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#EAEFF2; --panel:#FFFFFF; --panel-2:#F4F8FA; --sunken:#E3EAEE;
  --line:#D2DDE3; --line-soft:#E2EAEE;
  --text:#131E25; --text-2:#3C5058; --muted:#697E88;
  --write:#B96A12; --write-bg:#FBF1E3; --write-line:#E6C596; --write-fg:#FFFFFF;
  --ok:#2C7A5B; --info:#2F6BA8; --bad:#AF4029; --neutral:#697E88;
  --p0:#3C74B8; --p1:#6E5FC0; --p2:#2E8A72; --p3:#5C7688;
  --p4:#AF4E68; --p5:#6F7F2C; --p6:#2F8FA8; --p7:#8A5A9E;
  color-scheme: light;
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
select,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--write); outline-offset:2px; border-radius:2px}

.eyebrow{
  font-family:var(--mono); font-size:10px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
}
.mono{font-family:var(--mono)}

/* ============================================================
   SHELL
   ============================================================ */
.app{display:flex; flex-direction:column; min-height:100dvh}

.masthead{
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:baseline; gap:11px}
.brand h1{
  margin:0; font-family:var(--mono); font-size:15px; font-weight:600;
  letter-spacing:.06em; text-transform:uppercase; white-space:nowrap;
}

.modes{display:flex; gap:0; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin-right:auto}
.mode{padding:5px 14px; font-size:12.5px; color:var(--muted); background:var(--panel-2)}
.mode + .mode{border-left:1px solid var(--line)}
.mode:hover{color:var(--text)}
.mode[aria-pressed="true"]{background:var(--write-bg); color:var(--write); font-weight:600}
.mode b{font-family:var(--mono); font-size:11px; margin-right:5px; opacity:.7}

.stats{display:flex; gap:16px}
.stat{display:flex; flex-direction:column; align-items:flex-end; line-height:1.2}
.stat b{font-family:var(--mono); font-size:16px; font-weight:600; font-variant-numeric:tabular-nums}
.stat span{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-family:var(--mono)}

.tools{display:flex; gap:7px; flex-wrap:wrap}
.ghost{
  padding:5px 11px; border:1px solid var(--line); border-radius:var(--r);
  font-size:12px; color:var(--text-2); background:var(--panel-2); white-space:nowrap;
}
.ghost:hover{border-color:var(--muted); color:var(--text)}
.ghost.danger:hover{border-color:var(--bad); color:var(--bad)}

/* concept band -------------------------------------------------- */
.concepts{
  display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
  background:var(--line); border-bottom:1px solid var(--line);
}
.concept{padding:10px 20px; background:var(--panel-2); display:flex; gap:11px; align-items:flex-start}
.concept .glyph{
  flex:none; width:22px; height:22px; margin-top:1px;
  display:grid; place-items:center; font-family:var(--mono); font-size:11px; font-weight:600;
  border:1.5px solid currentColor; border-radius:3px;
}
.concept .glyph.round{border-radius:11px}
.concept h2{margin:0 0 1px; font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase}
.concept p{margin:0; font-size:12.5px; color:var(--text-2); line-height:1.5}

/* ============================================================
   CONSOLE GRID
   ============================================================ */
.console{
  flex:1; min-height:0; display:grid; gap:1px; background:var(--line);
  grid-template-columns:270px minmax(0,1fr) 380px;
}
.col{background:var(--panel); min-width:0; display:flex; flex-direction:column; min-height:0}
@media (min-width:1101px){ .col{overflow-y:auto} }

.pane-head{
  position:sticky; top:0; z-index:3; background:var(--panel);
  padding:12px 16px 9px; border-bottom:1px solid var(--line-soft);
  display:flex; align-items:center; gap:8px;
}
.pane-head .hint{margin-left:auto; font-size:11px; color:var(--muted)}
.sub-head{padding:15px 16px 6px; display:flex; align-items:center; gap:8px}
.sub-head .hair{flex:1; height:1px; background:var(--line-soft)}
.sub-head .plus{
  font-family:var(--mono); font-size:11px; color:var(--write); padding:1px 6px;
  border:1px dashed var(--write-line); border-radius:2px;
}
.sub-head .plus:hover{background:var(--write-bg)}

/* ============================================================
   左栏 —— 类型清单
   ============================================================ */
.type-list{display:flex; flex-direction:column; padding:0 8px 6px}
.type-row,.link-row,.act-row{
  display:flex; align-items:center; gap:9px; width:100%;
  padding:7px 8px; border-radius:var(--r); text-align:left; border:1px solid transparent;
}
.link-row{display:block}
.type-row:hover,.link-row:hover,.act-row:hover{background:var(--panel-2)}
.type-row[aria-pressed="true"],.link-row[aria-pressed="true"],.act-row[aria-pressed="true"]{
  background:var(--panel-2); border-color:var(--line);
}
.swatch{flex:none; width:10px; height:10px; border-radius:2px}
.type-row .body{flex:1; min-width:0}
.type-row .name{font-family:var(--mono); font-size:12.5px}
.type-row .cn{font-size:12px; color:var(--muted)}
.type-row .props{
  display:block; font-size:11px; color:var(--muted); font-family:var(--mono);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.type-row .count{
  margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted);
  font-variant-numeric:tabular-nums; flex:none;
}
.link-sig{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11.5px; flex-wrap:wrap}
.link-sig .arrow{color:var(--muted)}
.link-meta{display:flex; gap:8px; font-size:11px; color:var(--muted); margin-top:1px; flex-wrap:wrap}
.card-badge{
  font-family:var(--mono); font-size:10px; padding:0 4px; border:1px solid var(--line);
  border-radius:2px; color:var(--muted); flex:none;
}
.act-row .dot{flex:none; width:6px; height:6px; border-radius:50%; background:var(--write)}
.act-row .name{font-family:var(--mono); font-size:12px; color:var(--write)}
.act-row .cn{font-size:12px; color:var(--text-2)}
.rail-empty{padding:4px 16px 8px; font-size:12px; color:var(--muted)}

/* ============================================================
   中栏 —— 图谱
   ============================================================ */
.graph-wrap{position:relative; flex:none; height:clamp(300px, 42vh, 480px); border-bottom:1px solid var(--line)}
#graph{display:block; width:100%; height:100%; touch-action:none}
.graph-legend{position:absolute; left:14px; bottom:12px; display:flex; flex-wrap:wrap; gap:4px 12px; pointer-events:none}
.lg{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted)}
.lg i{width:8px; height:8px; border-radius:2px; display:block}
.graph-tip{
  position:absolute; right:14px; top:12px; font-size:11px; color:var(--muted);
  background:color-mix(in srgb, var(--panel) 82%, transparent); padding:3px 8px; border-radius:var(--r);
}

/* 对象详情 ------------------------------------------------------- */
.detail{padding:0 0 28px}
.obj-head{padding:16px 20px 14px; border-bottom:1px solid var(--line-soft)}
.obj-kicker{display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap}
.pill{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:11px;
  padding:1px 7px; border-radius:2px; border:1px solid;
}
.obj-head h3{margin:0; font-size:20px; letter-spacing:-.01em}
.obj-head .rid{font-family:var(--mono); font-size:12px; color:var(--muted)}

table.props{width:100%; border-collapse:collapse; font-size:13px}
table.props th,table.props td{padding:7px 20px; text-align:left; border-bottom:1px solid var(--line-soft); vertical-align:top}
table.props th{width:34%; font-weight:400; color:var(--muted); font-size:12.5px}
table.props th small{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.06em; opacity:.75}
table.props td{font-variant-numeric:tabular-nums}

.link-group{padding:2px 20px 12px}
.link-group-head{display:flex; align-items:center; gap:8px; padding:9px 0 6px; font-size:12px; flex-wrap:wrap}
.link-group-head .lt{font-family:var(--mono); font-size:11.5px; color:var(--text-2)}
.link-group-head .dir{color:var(--muted); font-size:11.5px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  display:inline-flex; align-items:center; gap:7px; padding:4px 10px 4px 8px;
  border:1px solid var(--line); border-radius:var(--r); background:var(--panel-2); font-size:12.5px;
}
.chip:hover{border-color:currentColor}
.chip i{width:8px; height:8px; border-radius:2px; flex:none}
.chip .rid{font-family:var(--mono); font-size:11px; color:var(--muted)}

.empty{padding:26px 20px; color:var(--muted); font-size:13px; max-width:64ch; line-height:1.65}
.empty b{color:var(--text-2); font-weight:600}
.empty .lead{color:var(--text); font-size:15px; margin:0 0 10px}

/* ============================================================
   建模 —— 编辑器表单
   ============================================================ */
.ed{padding:0 0 32px}
.ed-head{padding:16px 20px 13px; border-bottom:1px solid var(--line-soft)}
.ed-head h3{margin:4px 0 0; font-size:19px}
.ed-sec{padding:13px 20px; border-bottom:1px solid var(--line-soft)}
.ed-sec > .eyebrow{display:block; margin-bottom:9px}

.f-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px}
.field{display:flex; flex-direction:column; gap:3px}
.field label{font-size:12px; color:var(--text-2); display:flex; align-items:baseline; gap:6px}
.field label code{font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.field select,.field input,.field textarea{
  width:100%; padding:6px 8px; background:var(--panel); color:var(--text);
  border:1px solid var(--line); border-radius:var(--r); font-size:13px;
}
.field select:hover,.field input:hover{border-color:var(--muted)}
.field input[readonly]{background:var(--sunken); color:var(--muted)}

/* 一行结构化配置（参数 / 规则 / 编辑） */
.spec{
  display:flex; flex-wrap:wrap; align-items:center; gap:6px;
  padding:8px 9px; margin-bottom:7px; background:var(--panel-2);
  border:1px solid var(--line); border-radius:var(--r);
}
.spec.write{border-color:var(--write-line); background:var(--write-bg)}
.spec .lead{font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--muted); flex:none}
.spec .txt{font-size:12.5px; color:var(--text-2); flex:none}
.spec .kill{margin-left:auto; color:var(--muted); font-size:14px; line-height:1; padding:2px 5px; border-radius:2px; flex:none}
.spec .kill:hover{color:var(--bad); background:var(--panel)}
.spec .gloss{
  flex-basis:100%; font-size:11.5px; color:var(--muted); font-family:var(--mono);
  border-top:1px dashed var(--line); padding-top:6px; margin-top:1px; line-height:1.5;
}
.spec.write .gloss{border-top-color:var(--write-line); color:var(--write)}
.mini{
  padding:3px 6px; background:var(--panel); color:var(--text);
  border:1px solid var(--line); border-radius:2px; font-size:12px; max-width:190px;
}
.mini.n{width:74px; font-variant-numeric:tabular-nums}
.mini.s{width:112px}
select.mini{max-width:200px}
.mini:hover{border-color:var(--muted)}
.add{
  width:100%; padding:6px; border:1px dashed var(--line); border-radius:var(--r);
  font-size:12px; color:var(--muted); background:none;
}
.add:hover{border-color:var(--write); color:var(--write); background:var(--write-bg)}
.add.tight{width:auto; padding:4px 12px}

.prop-assign{display:grid; grid-template-columns:minmax(90px,auto) 1fr; gap:5px 8px; align-items:center; flex-basis:100%; margin-top:5px}
.prop-assign .k{font-size:12px; color:var(--text-2); font-family:var(--mono)}
.prop-assign .v{display:flex; gap:5px; align-items:center; flex-wrap:wrap}

.note{font-size:12px; color:var(--muted); line-height:1.6; margin:0}
.note code{font-family:var(--mono); font-size:11.5px}

/* ============================================================
   右栏 —— 运行：Action runner；建模：影响面板
   ============================================================ */
.action-tabs{display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 12px}
.tab{
  padding:4px 10px; border:1px solid var(--line); border-radius:var(--r);
  font-family:var(--mono); font-size:11.5px; color:var(--text-2); background:var(--panel-2);
}
.tab:hover{border-color:var(--write-line); color:var(--write)}
.tab[aria-pressed="true"]{background:var(--write-bg); border-color:var(--write); color:var(--write)}

.runner{margin:0 16px; border:1px solid var(--line); border-radius:var(--r); background:var(--panel-2)}
.runner-head{padding:12px 14px 11px; border-bottom:1px solid var(--line-soft)}
.runner-head h3{margin:0 0 3px; font-size:14.5px}
.runner-head p{margin:0; font-size:12px; color:var(--muted); line-height:1.5}
.runner-sec{padding:11px 14px; border-bottom:1px solid var(--line-soft)}
.runner-sec:last-child{border-bottom:none}
.runner-sec > .eyebrow{display:block; margin-bottom:8px}
.runner .field{margin-bottom:9px}
.runner .field:last-child{margin-bottom:0}

.check{display:flex; gap:8px; align-items:flex-start; font-size:12.5px; padding:2px 0; color:var(--text-2)}
.check .mk{font-family:var(--mono); font-size:12px; flex:none; width:14px; text-align:center}
.check.pass .mk{color:var(--ok)}
.check.fail .mk{color:var(--bad)}
.check.fail{color:var(--bad)}
.check.idle{color:var(--muted)}

.edit{display:flex; gap:8px; align-items:flex-start; font-size:12.5px; padding:3px 0}
.op{
  flex:none; font-family:var(--mono); font-size:10px; letter-spacing:.06em; padding:1px 5px;
  border-radius:2px; border:1px solid var(--write-line); color:var(--write); background:var(--write-bg);
  margin-top:1px; min-width:52px; text-align:center;
}
.edit .txt{color:var(--text-2)}
.edit .txt b{color:var(--text); font-weight:600}
.edit .txt code{font-family:var(--mono); font-size:11.5px}

.apply{
  width:100%; padding:9px; border-radius:var(--r); font-size:13px; font-weight:600;
  background:var(--write); color:var(--write-fg); border:1px solid var(--write);
}
.apply:disabled{opacity:.4; cursor:not-allowed}
.apply:not(:disabled):hover{filter:brightness(1.08)}
.apply-note{margin:7px 0 0; font-size:11.5px; color:var(--muted); text-align:center}

.impact{margin:0 16px 4px; border:1px solid var(--line); border-radius:var(--r); background:var(--panel-2); overflow:hidden}
.impact-sec{padding:11px 14px; border-bottom:1px solid var(--line-soft)}
.impact-sec:last-child{border-bottom:none}
.impact-sec > .eyebrow{display:block; margin-bottom:7px}
.impact-list{display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--text-2)}
.impact-list .row{display:flex; gap:8px; align-items:baseline}
.impact-list .row .n{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--text); min-width:26px}
.warn{
  font-size:12px; color:var(--bad); background:color-mix(in srgb, var(--bad) 8%, transparent);
  border:1px solid color-mix(in srgb, var(--bad) 30%, transparent); border-radius:var(--r);
  padding:8px 10px; line-height:1.55; margin:0 0 8px;
}

/* 日志 ----------------------------------------------------------- */
.log{padding:0 16px 24px; display:flex; flex-direction:column; gap:7px}
.log-entry{border:1px solid var(--line); border-radius:var(--r); background:var(--panel-2); overflow:hidden}
.log-entry > summary{padding:8px 11px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:12.5px; list-style:none}
.log-entry > summary::-webkit-details-marker{display:none}
.log-entry > summary::before{content:"▸"; color:var(--muted); font-size:10px; transition:transform .15s}
.log-entry[open] > summary::before{transform:rotate(90deg)}
.log-entry .ts{font-family:var(--mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.log-entry .who{font-family:var(--mono); font-size:11.5px; color:var(--write)}
.log-entry .n{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.log-body{padding:2px 11px 11px; border-top:1px solid var(--line-soft)}
.log-params{font-size:11.5px; color:var(--muted); font-family:var(--mono); padding:7px 0 4px; word-break:break-all}
.undo{margin-top:8px; padding:4px 10px; border:1px solid var(--line); border-radius:var(--r); font-size:11.5px; color:var(--text-2)}
.undo:hover{border-color:var(--bad); color:var(--bad)}
.slog{padding:0 16px 24px; display:flex; flex-direction:column; gap:5px; font-size:12.5px}
.slog .row{display:flex; gap:8px; align-items:baseline; color:var(--text-2)}
.slog .row .ts{font-family:var(--mono); font-size:11px; color:var(--muted); flex:none}

/* JSON 抽屉 ------------------------------------------------------ */
.drawer{
  position:fixed; inset:0; z-index:20; background:color-mix(in srgb, var(--bg) 78%, transparent);
  display:grid; place-items:center; padding:24px;
}
.drawer-box{
  width:min(860px, 100%); max-height:86vh; display:flex; flex-direction:column;
  background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden;
}
.drawer-head{padding:13px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px}
.drawer-head h3{margin:0; font-size:15px}
.drawer-head .ghost{margin-left:auto}
.drawer-box textarea{
  flex:1; min-height:340px; margin:0; padding:14px 16px; border:none; resize:none;
  background:var(--sunken); font-family:var(--mono); font-size:11.5px; line-height:1.6;
}
.drawer-foot{padding:11px 16px; border-top:1px solid var(--line); display:flex; align-items:center; gap:10px}
.drawer-foot .note{flex:1}

@media (max-width:1100px){
  .console{grid-template-columns:1fr}
  .concepts{grid-template-columns:1fr}
  .graph-wrap{height:340px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>

/* --- 查询工具 --------------------------------------------------- */
const OT = id => schema.objectTypes.find(t => t.id === id);
const LTof = id => schema.linkTypes.find(l => l.id === id);
const ATof = id => schema.actionTypes.find(a => a.id === id);
const get = k => world.objects[k];
const keysOf = type => Object.keys(world.objects).filter(k => world.objects[k].type === type);
const propOf = (typeId, propId) => { const t = OT(typeId); return t && t.props.find(p => p.id === propId); };
function titleOf(k){
  const o = get(k);
  if (!o) return String(k).split(":").pop();
  const t = OT(o.type);
  const v = t ? o.props[t.titleProp] : undefined;
  return (v === undefined || v === "") ? o.id : String(v);
}
const typeColor = typeId => { const t = OT(typeId); return `var(--p${t ? (t.color % 8) : 3})`; };
const hasLink = (t,a,b) => world.links.some(x => x.t===t && x.a===a && x.b===b);
function traverse(key, ltId, dir){
  return world.links.filter(x => x.t===ltId && (dir==="fwd" ? x.a===key : x.b===key))
                    .map(x => dir==="fwd" ? x.b : x.a);
}

/* ============================================================
   §4  Action 解释器
   声明式的 Target / Ref / Rule / EditSpec 在这里被求值
   ============================================================ */

/** 把一个 Target 解析成实例 key。解析不了返回 null（编辑会被跳过）。 */
function resolveTarget(t, ctx){
  if (!t) return null;
  if (t.kind === "param") return ctx.params[t.param] || null;
  if (t.kind === "new")   return ctx.created[t.uid] || null;
  if (t.kind === "hop"){
    const base = resolveTarget(t.from, ctx);
    if (!base) return null;
    return traverse(base, t.link, t.dir)[0] || null;
  }
  return null;
}

/** 把一个 Ref 解析成标量值。 */
function resolveRef(r, ctx){
  if (!r) return undefined;
  switch (r.src){
    case "const":  return r.value;
    case "consts": return r.values;
    case "param":  return ctx.params[r.param];
    case "prop": {
      const k = resolveTarget(r.of, ctx); if (!k) return undefined;
      const o = get(k); return o ? o.props[r.prop] : undefined;
    }
    case "calc": {
      const a = Number(resolveRef(r.a, ctx)), b = Number(resolveRef(r.b, ctx));
      if (!isFinite(a) || !isFinite(b)) return undefined;
      return r.op === "*" ? a*b : r.op === "-" ? a-b : a+b;
    }
    case "now":    return nowStamp();
    case "today":  return todayPlus(r.plusDays || 0);
    case "newId":  return ctx.newId;          // 只在 create 的属性赋值里有意义
    default: return undefined;
  }
}

const CMP = {
  "==": (a,b) => a === b,
  "!=": (a,b) => a !== b,
  ">":  (a,b) => Number(a) >  Number(b),
  ">=": (a,b) => Number(a) >= Number(b),
  "<":  (a,b) => Number(a) <  Number(b),
  "<=": (a,b) => Number(a) <= Number(b),
  "in": (a,b) => Array.isArray(b) && b.includes(a),
};

/** 求值一条规则，返回 {ok, why} */
function evalRule(rule, ctx){
  if (rule.type === "compare"){
    const l = resolveRef(rule.left, ctx), r = resolveRef(rule.right, ctx);
    if (l === undefined) return {ok:false, why:"取不到左值"};
    const ok = (CMP[rule.op] || CMP["=="])(l, r);
    return {ok, why: ok ? "" : `当前 ${fmtRaw(l)}`};
  }
  if (rule.type === "linkCount"){
    const k = resolveTarget(rule.target, ctx);
    if (!k) return {ok:false, why:"取不到目标对象"};
    const n = traverse(k, rule.link, rule.dir).length;
    const ok = (CMP[rule.op] || CMP["=="])(n, rule.n);
    return {ok, why: ok ? "" : `当前 ${n} 条`};
  }
  if (rule.type === "linkExists"){
    const a = resolveTarget(rule.a, ctx), b = resolveTarget(rule.b, ctx);
    if (!a || !b) return {ok:false, why:"取不到两端对象"};
    const has = hasLink(rule.link, a, b);
    const ok = rule.expect ? has : !has;
    return {ok, why: ok ? "" : (has ? "链接已存在" : "链接不存在")};
  }
  return {ok:true, why:""};
}

/** 生成具体编辑。纯函数 —— 不改动 world，可以在每次输入时调用。 */
function buildEdits(action, params){
  const ctx = {params, created:{}};
  const seqUsed = {};
  const out = [];

  // 先给所有 create 分配主键，这样后面的 link 才能引用它们
  for (const spec of action.edits){
    if (spec.op !== "create") continue;
    const t = OT(spec.objectType); if (!t) continue;
    seqUsed[t.id] = (seqUsed[t.id] || 0);
    ctx.created[spec.uid] = `${t.id}:${t.idPrefix}-${t.seq + seqUsed[t.id]}`;
    seqUsed[t.id]++;
  }

  for (const spec of action.edits){
    if (spec.op === "create"){
      const t = OT(spec.objectType); if (!t) continue;
      const key = ctx.created[spec.uid], id = key.split(":")[1];
      const props = {};
      for (const p of t.props){
        const ref = spec.props && spec.props[p.id];
        const v = ref ? resolveRef(ref, {...ctx, newId:id}) : undefined;
        props[p.id] = v === undefined ? defaultFor(p) : v;
      }
      out.push({op:"create", key, objectType:t.id, id, props});

    } else if (spec.op === "modify"){
      const key = resolveTarget(spec.target, ctx); if (!key) continue;
      const o = get(key); if (!o) continue;
      const v = resolveRef(spec.value, ctx); if (v === undefined) continue;
      const cur = o.props[spec.prop];
      let next = v;
      if (spec.mode === "inc") next = Number(cur) + Number(v);
      if (spec.mode === "dec") next = Number(cur) - Number(v);
      if (spec.mode === "mul") next = Number(cur) * Number(v);
      out.push({op:"modify", key, changes:{[spec.prop]: next}});

    } else if (spec.op === "link"){
      const a = resolveTarget(spec.a, ctx), b = resolveTarget(spec.b, ctx);
      const lt = LTof(spec.link);
      if (!a || !b || !lt) continue;
      if (hasLink(lt.id, a, b)) continue;                  // 已存在 → 这条编辑没必要
      // 基数守卫：重数为 1 的一端要先断开旧链接，约束才是真的生效
      const [fromMult, toMult] = lt.card.split(":").map(s => s.trim());
      if (toMult === "1")
        for (const l of world.links) if (l.t===lt.id && l.a===a) out.push({op:"unlink", t:lt.id, a:l.a, b:l.b});
      if (fromMult === "1")
        for (const l of world.links) if (l.t===lt.id && l.b===b) out.push({op:"unlink", t:lt.id, a:l.a, b:l.b});
      out.push({op:"link", t:lt.id, a, b});

    } else if (spec.op === "unlink"){
      const a = resolveTarget(spec.a, ctx), b = resolveTarget(spec.b, ctx);
      if (a && b && hasLink(spec.link, a, b)) out.push({op:"unlink", t:spec.link, a, b});

    } else if (spec.op === "delete"){
      const key = resolveTarget(spec.target, ctx);
      if (key && get(key)) out.push({op:"delete", key});
    }
  }
  return out;
}

/* --- 把声明式结构翻译成中文 --------------------------------------- */
function describeTarget(t, action){
  if (!t) return "？";
  if (t.kind === "param"){
    const p = action.params.find(x => x.id === t.param);
    return p ? p.cn : t.param;
  }
  if (t.kind === "new"){
    const e = action.edits.find(x => x.uid === t.uid);
    const ot = e && OT(e.objectType);
    return ot ? `新建的${ot.cn}` : "新建对象";
  }
  if (t.kind === "hop"){
    const lt = LTof(t.link);
    return `${describeTarget(t.from, action)} 的 ${lt ? (t.dir==="fwd" ? lt.fwd : lt.inv) : t.link}`;
  }
  return "？";
}
function targetType(t, action){
  if (!t) return null;
  if (t.kind === "param"){ const p = action.params.find(x => x.id === t.param); return p ? p.objectType : null; }
  if (t.kind === "new"){ const e = action.edits.find(x => x.uid === t.uid); return e ? e.objectType : null; }
  if (t.kind === "hop"){ const lt = LTof(t.link); return lt ? (t.dir === "fwd" ? lt.to : lt.from) : null; }
  return null;
}
function describeRef(r, action){
  if (!r) return "？";
  switch (r.src){
    case "const":  return String(r.value);
    case "consts": return (r.values||[]).join(" / ");
    case "param":  { const p = action.params.find(x => x.id === r.param); return p ? p.cn : r.param; }
    case "prop":   { const pr = propOf(targetType(r.of, action), r.prop);
                     return `${describeTarget(r.of, action)}.${pr ? pr.cn : r.prop}`; }
    case "calc":   return `${describeRef(r.a, action)} ${r.op} ${describeRef(r.b, action)}`;
    case "now":    return "当前时间";
    case "today":  return r.plusDays ? `${r.plusDays} 天后` : "今天";
    case "newId":  return "新对象的主键";
    default: return "？";
  }
}
const OPCN = {"==":"等于","!=":"不等于",">":"大于",">=":"大于等于","<":"小于","<=":"小于等于","in":"属于"};
function describeRule(rule, action){
  if (rule.type === "compare")
    return `${describeRef(rule.left, action)} ${OPCN[rule.op]} ${describeRef(rule.right, action)}`;
  if (rule.type === "linkCount"){
    const lt = LTof(rule.link);
    return `${describeTarget(rule.target, action)} 的「${lt ? (rule.dir==="fwd"?lt.fwd:lt.inv) : rule.link}」数量 ${OPCN[rule.op]} ${rule.n}`;
  }
  if (rule.type === "linkExists"){
    const lt = LTof(rule.link);
    return `${describeTarget(rule.a, action)} 与 ${describeTarget(rule.b, action)} 之间${rule.expect ? "存在" : "不存在"}「${lt ? lt.id : rule.link}」链接`;
  }
  return "";
}
const MODECN = {set:"设为", inc:"增加", dec:"减少", mul:"乘以"};
function describeSpec(spec, action){
  if (spec.op === "create"){
    const t = OT(spec.objectType);
    return {op:"CREATE", txt:`新建一个${t ? t.cn : spec.objectType}对象`};
  }
  if (spec.op === "modify"){
    const pr = propOf(targetType(spec.target, action), spec.prop);
    return {op:"MODIFY", txt:`${describeTarget(spec.target, action)}.${pr ? pr.cn : spec.prop} ${MODECN[spec.mode]} ${describeRef(spec.value, action)}`};
  }
  if (spec.op === "link")
    return {op:"LINK", txt:`${describeTarget(spec.a, action)} ──${spec.link}──▸ ${describeTarget(spec.b, action)}`};
  if (spec.op === "unlink")
    return {op:"UNLINK", txt:`断开 ${describeTarget(spec.a, action)} ──${spec.link}──▸ ${describeTarget(spec.b, action)}`};
  return {op:"DELETE", txt:`删除 ${describeTarget(spec.target, action)}`};
}
/** 描述一条已经具体化的编辑（用于预览与日志） */
function describeEdit(e){
  if (e.op === "create"){
    const t = OT(e.objectType);
    return {op:"CREATE", html:`新建 <b>${esc(t ? t.cn : e.objectType)}</b> <code>${esc(e.id)}</code>`};
  }
  if (e.op === "modify"){
    const o = get(e.key);
    const parts = Object.entries(e.changes).map(([k,v]) => {
      const pr = o ? propOf(o.type, k) : null;
      return `${esc(pr ? pr.cn : k)} → <code>${esc(fmtRaw(v))}</code>`;
    }).join("，");
    return {op:"MODIFY", html:`<b>${esc(titleOf(e.key))}</b> ${parts}`};
  }
  if (e.op === "link")
    return {op:"LINK", html:`<b>${esc(titleOf(e.a))}</b> <code>${esc(e.t)}</code> <b>${esc(titleOf(e.b))}</b>`};
  if (e.op === "unlink")
    return {op:"UNLINK", html:`断开 <b>${esc(titleOf(e.a))}</b> <code>${esc(e.t)}</code> <b>${esc(titleOf(e.b))}</b>`};
  return {op:"DELETE", html:`删除 <b>${esc(titleOf(e.key))}</b>`};
}

/* ============================================================
   §5  编辑引擎
   ============================================================ */
function applyEdits(edits){
  const inverse = [];
  for (const e of edits){
    if (e.op === "create"){
      world.objects[e.key] = {type:e.objectType, id:e.id, props:{...e.props}};
      const t = OT(e.objectType);
      const n = parseInt(String(e.id).split("-").pop(), 10);
      if (t && isFinite(n) && n >= t.seq) t.seq = n + 1;
      inverse.unshift({op:"delete", key:e.key});
      flash(e.key);
    } else if (e.op === "modify"){
      const o = get(e.key); if (!o) continue;
      const before = {};
      for (const k in e.changes){ before[k] = o.props[k]; o.props[k] = e.changes[k]; }
      inverse.unshift({op:"modify", key:e.key, changes:before});
      flash(e.key);
    } else if (e.op === "delete"){
      const o = get(e.key); if (!o) continue;
      const cut = world.links.filter(x => x.a === e.key || x.b === e.key);
      inverse.unshift({op:"create", key:e.key, objectType:o.type, id:o.id, props:{...o.props}});
      for (const l of cut) inverse.unshift({op:"link", t:l.t, a:l.a, b:l.b});
      world.links = world.links.filter(x => x.a !== e.key && x.b !== e.key);
      delete world.objects[e.key];
    } else if (e.op === "link"){
      if (!hasLink(e.t, e.a, e.b)) world.links.push({t:e.t, a:e.a, b:e.b});
      inverse.unshift({op:"unlink", t:e.t, a:e.a, b:e.b});
    } else if (e.op === "unlink"){
      world.links = world.links.filter(x => !(x.t===e.t && x.a===e.a && x.b===e.b));
      inverse.unshift({op:"link", t:e.t, a:e.a, b:e.b});
    }
  }
  return inverse;
}

function runAction(action, params){
  const edits = buildEdits(action, params);
  const seqBefore = Object.fromEntries(schema.objectTypes.map(t => [t.id, t.seq]));
  const inverse = applyEdits(edits);
  editCount += edits.length;
  logEntries.unshift({
    ts: new Date().toTimeString().slice(0,8),
    actionId: action.id, actionCn: action.cn,
    params: action.params.map(pr => {
      const v = params[pr.id];
      return `${pr.id}=${pr.kind === "object" ? titleOf(v) : v}`;
    }).join("  "),
    edits: edits.map(describeEdit), inverse, editN: edits.length, seqBefore,
  });
  const created = edits.find(e => e.op === "create");
  selected = created ? created.key
           : (Object.values(params).find(v => typeof v === "string" && world.objects[v]) || selected);
  syncGraph(); renderAll();
}

function undoLast(){
  const entry = logEntries.shift();
  if (!entry) return;
  applyEdits(entry.inverse);
  if (entry.seqBefore) for (const t of schema.objectTypes)
    if (entry.seqBefore[t.id] !== undefined) t.seq = entry.seqBefore[t.id];
  editCount -= entry.editN;
  if (!world.objects[selected]) selected = null;
  syncGraph(); renderAll();
}

/* ============================================================
   §6  格式化
   ============================================================ */
const fmtRaw = v => (v === true ? "是" : v === false ? "否" : String(v));
function fmtValue(v, p){
  if (v === undefined || v === "") return `<span style="color:var(--muted)">—</span>`;
  if (p.type === "currency") return "¥" + Number(v).toLocaleString("zh-CN");
  if (p.type === "integer")  return Number(v).toLocaleString("zh-CN");
  if (p.type === "boolean")  return v ? "是" : "否";
  if (p.type === "enum"){
    const tone = TONE[v] || "neutral";
    return `<span class="pill" style="color:var(--${tone});border-color:currentColor">${esc(v)}</span>`;
  }
  return esc(v);
}

/* ============================================================
   §7  图谱 —— 建模模式画类型图，运行模式画实例图
   ============================================================ */
const canvas = document.getElementById("graph");
const ctx2d = canvas.getContext("2d");
const layouts = {operate:new Map(), model:new Map()};
let flashes = new Map();
let alpha = 1, raf = null, dragging = null, hovered = null;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const flash = key => flashes.set(key, performance.now());
const nodes = () => layouts[mode];

/** 两种模式共用一套布局与绘制，只是喂进去的数据不同 */
function graphData(){
  if (mode === "model"){
    return {
      // 类型图谱上同时挂 API 名和中文名，只改了其中一个也不会看着眼生
      nodes: schema.objectTypes.map(t => ({key:t.id, label: t.cn && t.cn !== t.id ? `${t.id} ${t.cn}` : t.id,
                                           color:typeColor(t.id),
                                           active: editing && editing.kind==="ot" && editing.id===t.id})),
      edges: schema.linkTypes.map(l => ({a:l.from, b:l.to, label:l.id, id:l.id,
                                         active: editing && editing.kind==="lt" && editing.id===l.id})),
    };
  }
  return {
    nodes: Object.keys(world.objects).map(k => ({key:k, label:titleOf(k), color:typeColor(get(k).type),
                                                 active: k === selected})),
    edges: world.links.map(l => ({a:l.a, b:l.b, label:l.t, id:l.t, active: selected && (l.a===selected||l.b===selected)})),
  };
}

let theme = {};
function refreshTheme(){
  const cs = getComputedStyle(document.documentElement);
  theme = {line:cs.getPropertyValue("--line").trim(), muted:cs.getPropertyValue("--muted").trim(),
           text:cs.getPropertyValue("--text").trim(), panel:cs.getPropertyValue("--panel").trim(),
           write:cs.getPropertyValue("--write").trim()};
  for (let i=0;i<8;i++) theme["p"+i] = cs.getPropertyValue("--p"+i).trim();
  kick();
}
const solid = c => { const m = /var\(--(p\d)\)/.exec(c); return m ? theme[m[1]] : c; };

function syncGraph(){
  const map = nodes();
  const cx = canvas.clientWidth/2 || 300, cy = canvas.clientHeight/2 || 200;
  const data = graphData();
  data.nodes.forEach((n,i) => {
    if (!map.has(n.key)){
      const a = (i / Math.max(data.nodes.length,1)) * Math.PI*2;
      map.set(n.key, {x:cx + Math.cos(a)*140 + Math.random()*8, y:cy + Math.sin(a)*110 + Math.random()*8,
                      vx:0, vy:0, w:80, h:26, pinned:false});
    }
  });
  const live = new Set(data.nodes.map(n => n.key));
  for (const k of [...map.keys()]) if (!live.has(k)) map.delete(k);
  measureNodes();
  kick();
}
function measureNodes(){
  ctx2d.font = '600 11.5px ' + getComputedStyle(document.body).getPropertyValue("--mono");
  for (const n of graphData().nodes){
    const g = nodes().get(n.key); if (!g) continue;
    g.w = Math.min(170, ctx2d.measureText(n.label).width + 30);
    g.h = 26;
  }
}
function relayout(){
  const cx = canvas.clientWidth/2, cy = canvas.clientHeight/2;
  const keys = [...nodes().keys()];
  keys.forEach((k,i) => {
    const n = nodes().get(k), a = (i/keys.length)*Math.PI*2;
    n.x = cx + Math.cos(a)*150; n.y = cy + Math.sin(a)*120; n.vx = n.vy = 0; n.pinned = false;
  });
  kick();
}

function step(){
  const W = canvas.clientWidth, H = canvas.clientHeight;
  const map = nodes(), arr = [...map.values()];
  const data = graphData();
  for (const n of arr){ n.fx = 0; n.fy = 0; }
  const GAP = 14;
  for (let i=0;i<arr.length;i++) for (let j=i+1;j<arr.length;j++){
    const a = arr[i], b = arr[j];
    let dx = b.x-a.x, dy = b.y-a.y, d2 = dx*dx+dy*dy;
    if (d2 < 1){ dx = Math.random()-0.5; dy = Math.random()-0.5; d2 = 1; }
    const d = Math.sqrt(d2), ux = dx/d, uy = dy/d;
    const f = Math.min(13000/d2, 45);
    a.fx -= ux*f; a.fy -= uy*f; b.fx += ux*f; b.fy += uy*f;
    const ox = (a.w+b.w)/2 + GAP - Math.abs(dx);
    const oy = (a.h+b.h)/2 + GAP - Math.abs(dy);
    if (ox > 0 && oy > 0){
      if (ox < oy){ const p = Math.sign(dx||1) * ox * 0.5;  a.fx -= p; b.fx += p; }
      else        { const p = Math.sign(dy||1) * oy * 0.55; a.fy -= p; b.fy += p; }
    }
  }
  for (const e of data.edges){
    const a = map.get(e.a), b = map.get(e.b);
    if (!a || !b || a === b) continue;
    const dx = b.x-a.x, dy = b.y-a.y, d = Math.hypot(dx,dy) || 1;
    const rest = (a.w+b.w)/2 + 74;
    const f = (d - rest) * 0.04, ux = dx/d, uy = dy/d;
    a.fx += ux*f; a.fy += uy*f; b.fx -= ux*f; b.fy -= uy*f;
  }
  const cx = W/2, cy = H/2;
  for (const n of arr){
    n.fx += (cx-n.x)*0.009; n.fy += (cy-n.y)*0.016;
    if (n.pinned){ n.vx = n.vy = 0; continue; }
    n.vx = (n.vx + n.fx*alpha) * 0.84;
    n.vy = (n.vy + n.fy*alpha) * 0.84;
    n.x += n.vx; n.y += n.vy;
    n.x = Math.max(n.w/2+8, Math.min(W-n.w/2-8, n.x));
    n.y = Math.max(n.h/2+8, Math.min(H-n.h/2-8, n.y));
  }
  alpha *= 0.985;
}

function rectEdge(n, dx, dy){
  const hw = n.w/2+3, hh = n.h/2+3;
  const s = Math.min(hw/Math.abs(dx||1e-6), hh/Math.abs(dy||1e-6));
  return [n.x + dx*s, n.y + dy*s];
}

function draw(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (canvas.width !== W*dpr || canvas.height !== H*dpr){ canvas.width = W*dpr; canvas.height = H*dpr; }
  ctx2d.setTransform(dpr,0,0,dpr,0,0);
  ctx2d.clearRect(0,0,W,H);

  const map = nodes(), data = graphData();
  const monoFace = getComputedStyle(document.body).getPropertyValue("--mono");
  const anyActive = data.nodes.some(n => n.active);
  const nbr = new Set();
  if (mode === "operate" && selected)
    for (const e of data.edges){ if (e.a===selected) nbr.add(e.b); if (e.b===selected) nbr.add(e.a); }

  const dimNode = n => {
    if (highlight){
      if (highlight.kind === "objectType")
        return (mode==="model" ? n.key===highlight.id : get(n.key) && get(n.key).type===highlight.id) ? 1 : 0.16;
      const lt = LTof(highlight.id);
      const ty = mode==="model" ? n.key : (get(n.key) && get(n.key).type);
      return lt && (ty===lt.from || ty===lt.to) ? 1 : 0.16;
    }
    if (mode === "operate" && selected) return n.key===selected ? 1 : (nbr.has(n.key) ? 1 : 0.3);
    if (mode === "model" && anyActive)  return n.active ? 1 : 0.42;
    return 1;
  };
  const dimByKey = k => { const n = data.nodes.find(x => x.key===k); return n ? dimNode(n) : 1; };

  for (const e of data.edges){
    const a = map.get(e.a), b = map.get(e.b);
    if (!a || !b) continue;
    let op = Math.min(dimByKey(e.a), dimByKey(e.b));
    if (highlight && highlight.kind === "linkType") op = e.id === highlight.id ? 1 : 0.1;
    const strong = e.active || (highlight && highlight.kind==="linkType" && e.id===highlight.id);
    const dx = b.x-a.x, dy = b.y-a.y;
    if (a === b) continue;
    const [x1,y1] = rectEdge(a, dx, dy);
    const [x2,y2] = rectEdge(b, -dx, -dy);

    ctx2d.globalAlpha = op * (strong ? 0.95 : 0.5);
    ctx2d.strokeStyle = strong ? theme.text : theme.line;
    ctx2d.lineWidth = strong ? 1.4 : 1;
    ctx2d.beginPath(); ctx2d.moveTo(x1,y1); ctx2d.lineTo(x2,y2); ctx2d.stroke();

    const ang = Math.atan2(y2-y1, x2-x1);
    ctx2d.fillStyle = strong ? theme.text : theme.line;
    ctx2d.beginPath(); ctx2d.moveTo(x2,y2);
    ctx2d.lineTo(x2 - 7*Math.cos(ang-0.4), y2 - 7*Math.sin(ang-0.4));
    ctx2d.lineTo(x2 - 7*Math.cos(ang+0.4), y2 - 7*Math.sin(ang+0.4));
    ctx2d.closePath(); ctx2d.fill();

    if (strong || mode === "model"){
      const mx = (x1+x2)/2, my = (y1+y2)/2;
      ctx2d.font = '500 10px ' + monoFace;
      const tw = ctx2d.measureText(e.label).width;
      ctx2d.globalAlpha = op * 0.95;
      ctx2d.fillStyle = theme.panel;
      ctx2d.fillRect(mx-tw/2-3, my-7, tw+6, 13);
      ctx2d.fillStyle = strong ? theme.text : theme.muted;
      ctx2d.textAlign = "center"; ctx2d.textBaseline = "middle";
      ctx2d.fillText(e.label, mx, my);
    }
  }

  ctx2d.textAlign = "left"; ctx2d.textBaseline = "middle";
  for (const n of data.nodes){
    const g = map.get(n.key); if (!g) continue;
    const col = solid(n.color), op = dimNode(n);
    const x = g.x - g.w/2, y = g.y - g.h/2;

    ctx2d.globalAlpha = op;
    roundRect(x, y, g.w, g.h, 4);
    ctx2d.fillStyle = theme.panel; ctx2d.fill();
    ctx2d.globalAlpha = op * 0.1; ctx2d.fillStyle = col; ctx2d.fill();
    ctx2d.globalAlpha = op;
    ctx2d.strokeStyle = col; ctx2d.lineWidth = n.active ? 2 : 1; ctx2d.stroke();

    if (n.active){
      ctx2d.globalAlpha = op * 0.35;
      roundRect(x-3.5, y-3.5, g.w+7, g.h+7, 6);
      ctx2d.strokeStyle = col; ctx2d.lineWidth = 1; ctx2d.stroke();
    }
    const f = flashes.get(n.key);
    if (f !== undefined){
      const t = (performance.now() - f) / 2200;
      if (t >= 1) flashes.delete(n.key);
      else {
        ctx2d.globalAlpha = (1-t) * 0.9;
        roundRect(x-3-t*7, y-3-t*7, g.w+6+t*14, g.h+6+t*14, 6+t*6);
        ctx2d.strokeStyle = theme.write; ctx2d.lineWidth = 1.5; ctx2d.stroke();
      }
    }
    ctx2d.globalAlpha = op;
    ctx2d.fillStyle = col;
    ctx2d.beginPath(); ctx2d.arc(x+11, g.y, 3.2, 0, Math.PI*2); ctx2d.fill();
    ctx2d.fillStyle = theme.text;
    ctx2d.font = '500 11.5px ' + monoFace;
    ctx2d.fillText(clip(n.label, g.w-26), x+19, g.y+0.5);
  }
  ctx2d.globalAlpha = 1;

  if (!data.nodes.length){
    ctx2d.fillStyle = theme.muted;
    ctx2d.font = '13px ' + getComputedStyle(document.body).getPropertyValue("--sans");
    ctx2d.textAlign = "center";
    ctx2d.fillText(mode === "model" ? "本体还是空的 —— 从左边新建第一个对象类型"
                                    : "还没有任何实例 —— 去建模模式定义类型，再用操作创建对象",
                   W/2, H/2);
    ctx2d.textAlign = "left";
  }
}
function clip(s, max){
  if (ctx2d.measureText(s).width <= max) return s;
  let t = s;
  while (t.length > 1 && ctx2d.measureText(t+"…").width > max) t = t.slice(0,-1);
  return t + "…";
}
function roundRect(x,y,w,h,r){
  ctx2d.beginPath();
  ctx2d.moveTo(x+r,y); ctx2d.arcTo(x+w,y,x+w,y+h,r); ctx2d.arcTo(x+w,y+h,x,y+h,r);
  ctx2d.arcTo(x,y+h,x,y,r); ctx2d.arcTo(x,y,x+w,y,r); ctx2d.closePath();
}
function loop(){
  step(); draw();
  if (alpha > 0.008 || dragging || flashes.size) raf = requestAnimationFrame(loop);
  else { raf = null; draw(); }
}
function kick(){
  alpha = Math.max(alpha, 0.55);
  if (REDUCED){ for (let i=0;i<220;i++) step(); alpha = 0; draw(); return; }
  if (!raf) raf = requestAnimationFrame(loop);
}
function nodeAt(px, py){
  for (const [k,n] of [...nodes()].reverse())
    if (Math.abs(px-n.x) <= n.w/2 && Math.abs(py-n.y) <= n.h/2) return k;
  return null;
}
canvas.addEventListener("pointerdown", ev => {
  const r = canvas.getBoundingClientRect();
  const k = nodeAt(ev.clientX-r.left, ev.clientY-r.top);
  if (!k) return;
  dragging = k; nodes().get(k).pinned = true;
  canvas.setPointerCapture(ev.pointerId);
  if (mode === "operate") select(k); else openEditor("ot", k);
});
canvas.addEventListener("pointermove", ev => {
  const r = canvas.getBoundingClientRect();
  const px = ev.clientX-r.left, py = ev.clientY-r.top;
  if (dragging){ const n = nodes().get(dragging); if (n){ n.x = px; n.y = py; } kick(); return; }
  const k = nodeAt(px, py);
  if (k !== hovered){ hovered = k; canvas.style.cursor = k ? "pointer" : "default"; }
});
const endDrag = () => { if (dragging){ const n = nodes().get(dragging); if (n) n.pinned = false; dragging = null; kick(); } };
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
new ResizeObserver(() => kick()).observe(canvas);

/* ============================================================
   §8  概念带 / 统计 / 左栏
   ============================================================ */
function renderConcepts(){
  const cards = mode === "model" ? [
    {g:"▣", cn:"Object Type 对象类型", en:"", round:false, color:"var(--p0)",

function defaultParams(action){
  const p = {};
  for (const pr of action.params){
    if (pr.kind === "object"){
      const opts = keysOf(pr.objectType);
      p[pr.id] = (selected && get(selected) && get(selected).type === pr.objectType && opts.includes(selected))
                 ? selected : (opts[0] || "");
    } else if (pr.kind === "enum") p[pr.id] = pr.def ?? (pr.options||[])[0] ?? "";
    else if (pr.kind === "number") p[pr.id] = pr.def ?? 0;
    else p[pr.id] = pr.def ?? "";
  }
  return p;
}
function evaluate(action, p){
  const complete = action.params.every(pr => p[pr.id] !== "" && p[pr.id] !== undefined && p[pr.id] !== null);
  const ctx = {params:p, created:{}};
  const results = action.rules.map(r => {
    if (!complete) return {cn:describeRule(r, action), state:"idle"};
    let res; try { res = evalRule(r, ctx); } catch { res = {ok:false, why:"求值失败"}; }
    return {cn:describeRule(r, action), state:res.ok ? "pass" : "fail", why:res.why};
  });
  const valid = complete && results.every(r => r.state === "pass");
  let edits = [];
  if (valid){ try { edits = buildEdits(action, p); } catch { edits = []; } }
  return {complete, results, valid, edits};
}

function renderRunner(){
  const right = document.getElementById("col-right");
  if (!schema.actionTypes.length){
    right.innerHTML = `<div class="pane-head"><span class="eyebrow">操作执行器 / Action</span></div>
      <div class="empty">本体里还没有操作类型。<br><br>
      在 Ontology 里，实例数据不能被随手改写 —— 必须经过一个 <b>Action</b>。
      切到<b>本体建模</b>建一个操作类型，这里就能执行了。</div>`;
    return;
  }
  if (!ATof(activeAction)) activeAction = schema.actionTypes[0].id;
  const action = ATof(activeAction);

  if (formState.__action !== activeAction) formState = {__action: activeAction, ...defaultParams(action)};
  for (const pr of action.params){
    if (pr.kind !== "object") continue;
    const opts = keysOf(pr.objectType);
    if (!opts.includes(formState[pr.id])) formState[pr.id] = opts[0] || "";
  }
  const p = {...formState}; delete p.__action;
  const ev = evaluate(action, p);

  const fields = action.params.map(pr => {
    let input, hint;
    if (pr.kind === "object"){
      const opts = keysOf(pr.objectType);
      hint = pr.objectType;
      input = `<select data-p="${esc(pr.id)}">${opts.length ? "" : '<option value="">（还没有这类对象）</option>'}${
        opts.map(k => {
          const label = titleOf(k) === get(k).id ? titleOf(k) : `${titleOf(k)} · ${get(k).id}`;
          return `<option value="${esc(k)}" ${k===p[pr.id]?"selected":""}>${esc(label)}</option>`;
        }).join("")}</select>`;
    } else if (pr.kind === "enum"){
      hint = "enum";
      input = `<select data-p="${esc(pr.id)}">${(pr.options||[]).map(o =>
        `<option ${o===p[pr.id]?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    } else if (pr.kind === "number"){
      hint = "number";
      input = `<input type="number" data-p="${esc(pr.id)}" value="${esc(p[pr.id])}">`;
    } else {
      hint = "text";
      input = `<input type="text" data-p="${esc(pr.id)}" value="${esc(p[pr.id])}">`;
    }
    return `<div class="field"><label>${esc(pr.cn)} <code>${esc(pr.id)} : ${esc(hint)}</code></label>${input}</div>`;
  }).join("") || `<p class="note">这个操作没有参数。</p>`;

  const checks = ev.results.map(r => `
    <div class="check ${r.state}">
      <span class="mk">${r.state==="pass" ? "✓" : r.state==="fail" ? "✕" : "·"}</span>
      <span>${esc(r.cn)}${r.why ? ` <span style="opacity:.8">— ${esc(r.why)}</span>` : ""}</span>
    </div>`).join("") || `<p class="note">没有校验规则 —— 这个操作永远可以提交。</p>`;

  const previews = ev.valid && ev.edits.length
    ? ev.edits.map(describeEdit).map(e =>
        `<div class="edit"><span class="op">${e.op}</span><span class="txt">${e.html}</span></div>`).join("")
    : `<p class="note">${ev.complete ? "校验未通过，暂无编辑可提交。" : "填完参数后这里会列出将要写入的编辑。"}</p>`;

  right.innerHTML = `
    <div class="pane-head"><span class="eyebrow">操作执行器 / Action</span></div>
    <div class="action-tabs">${schema.actionTypes.map(a =>
      `<button class="tab" data-action="${esc(a.id)}" aria-pressed="${a.id===activeAction}">${esc(a.cn)}</button>`).join("")}</div>
    <div class="runner">
      <div class="runner-head">
        <h3>${esc(action.cn)} <span class="mono" style="font-size:11.5px;color:var(--muted)">${esc(action.id)}</span></h3>
        <p>${esc(action.desc || "")}</p>
      </div>
      <div class="runner-sec"><span class="eyebrow">① 参数 Parameters</span>${fields}</div>
      <div class="runner-sec"><span class="eyebrow">② 校验 Validation</span>${checks}</div>
      <div class="runner-sec"><span class="eyebrow">③ 编辑预览 Edits <span style="color:var(--write)">${ev.valid ? ev.edits.length : 0}</span></span>${previews}</div>
      <div class="runner-sec">
        <button class="apply" id="apply" ${ev.valid ? "" : "disabled"}>应用操作 · 写回本体</button>
        <p class="apply-note">${ev.valid ? "全部编辑将作为一个事务原子提交" : "校验未通过时无法提交"}</p>
      </div>
    </div>
    <div class="sub-head"><span class="eyebrow">写入日志 / Audit</span><span class="hair"></span></div>
    <div class="log">${renderLogHtml()}</div>`;
}

/** 枚举一个 Action 里所有可选的对象目标：参数、参数走一跳、本次新建 */
function targetsFor(action){
  const out = [];
  for (const p of action.params)
    if (p.kind === "object" && OT(p.objectType))
      out.push({t:{kind:"param", param:p.id}, label:p.cn, objectType:p.objectType});
  for (const b of [...out]){
    for (const lt of schema.linkTypes){
      if (lt.from === b.objectType)
        out.push({t:{kind:"hop", from:b.t, link:lt.id, dir:"fwd"}, label:`${b.label} 的 ${lt.fwd}`, objectType:lt.to});
      if (lt.to === b.objectType)
        out.push({t:{kind:"hop", from:b.t, link:lt.id, dir:"inv"}, label:`${b.label} 的 ${lt.inv}`, objectType:lt.from});
    }
  }
  for (const e of action.edits)
    if (e.op === "create" && OT(e.objectType))
      out.push({t:{kind:"new", uid:e.uid}, label:`新建的${OT(e.objectType).cn}`, objectType:e.objectType});
  return out;
}
const tkey = t => JSON.stringify(t);

/** 通用小控件 */
function sel(path, value, options, cls){
  return `<select class="mini ${cls||""}" data-path="${esc(path)}">${
    options.map(o => `<option value="${esc(o.v)}" ${String(o.v)===String(value)?"selected":""}>${esc(o.l)}</option>`).join("")
  }</select>`;
}
function selT(path, value, targets, filterType){
  const list = targets.filter(t => !filterType || t.objectType === filterType);
  if (!list.length) return `<span class="txt" style="color:var(--bad)">没有可用目标</span>`;
  const cur = tkey(value);
  const known = list.some(t => tkey(t.t) === cur);
  return `<select class="mini" data-path="${esc(path)}" data-json="1">${
    (known ? "" : `<option value="${esc(cur)}" selected>（当前引用已失效）</option>`) +
    list.map(t => `<option value="${esc(tkey(t.t))}" ${tkey(t.t)===cur?"selected":""}>${esc(t.label)}</option>`).join("")
  }</select>`;
}
function txt(path, value, cls, ph){
  return `<input class="mini ${cls||""}" type="text" data-path="${esc(path)}" value="${esc(value ?? "")}" placeholder="${esc(ph||"")}">`;
}
function numf(path, value){
  return `<input class="mini n" type="number" data-path="${esc(path)}" data-num="1" value="${esc(value ?? 0)}">`;
}

}

/* --- 操作类型编辑器（本体建模里最有内容的一块） -------------------- */
function renderActionTypeEditor(a){
  const T = targetsFor(a);
  const otOpts = schema.objectTypes.map(t => ({v:t.id, l:`${t.id} ${t.cn}`}));
  const ltOpts = schema.linkTypes.map(l => ({v:l.id, l:l.id}));
  const cmpOpts = Object.keys(OPCN).map(o => ({v:o, l:OPCN[o]}));

  /* 参数 */
  const paramRows = a.params.map((p,i) => `
    <div class="spec">
      <span class="lead">参数</span>
      ${txt(`at.${a.id}.params.${i}.cn`, p.cn, "s", "中文名")}
      <input class="mini s" type="text" value="${esc(p.id)}" readonly title="参数 API 名创建后不可改 —— 规则和编辑都按它引用">
      ${sel(`at.${a.id}.params.${i}.kind`, p.kind,
            [{v:"object",l:"对象引用"},{v:"number",l:"数字"},{v:"text",l:"文本"},{v:"enum",l:"枚举"}])}
      ${p.kind === "object" ? sel(`at.${a.id}.params.${i}.objectType`, p.objectType, otOpts) : ""}
      ${p.kind === "enum"   ? txt(`at.${a.id}.params.${i}.optionsCsv`, (p.options||[]).join("，"), "", "选项，逗号分隔") : ""}
      ${p.kind === "number" ? numf(`at.${a.id}.params.${i}.def`, p.def ?? 0) : ""}
      <button class="kill" data-del="param" data-at="${esc(a.id)}" data-i="${i}">✕</button>
    </div>`).join("") || `<p class="note" style="margin-bottom:8px">还没有参数。</p>`;

  /* 值来源（规则两侧、编辑赋值都用它） */
  function refCtl(path, r, allowProp){
    const kinds = [{v:"const",l:"常量"},{v:"param",l:"参数"}];
    if (allowProp) kinds.push({v:"prop",l:"属性"});
    const src = r && r.src ? r.src : "const";
    let tail = "";
    if (src === "const") tail = txt(`${path}.value`, r ? r.value : "", "s", "值");
    else if (src === "param"){
      const ps = a.params.map(p => ({v:p.id, l:p.cn}));
      tail = ps.length ? sel(`${path}.param`, r && r.param, ps) : `<span class="txt" style="color:var(--bad)">先加参数</span>`;
    } else if (src === "prop"){
      const ty = targetType(r && r.of, a);
      const props = ty && OT(ty) ? OT(ty).props.map(p => ({v:p.id, l:p.cn})) : [];
      tail = selT(`${path}.of`, r && r.of, T) +
             (props.length ? sel(`${path}.prop`, r && r.prop, props) : `<span class="txt">（无属性）</span>`);
    }
    return sel(`${path}.src`, src, kinds) + tail;
  }

  /* 规则 */
  const ruleRows = a.rules.map((r,i) => {
    const base = `at.${a.id}.rules.${i}`;
    let body = "";
    if (r.type === "compare"){
      body = refCtl(`${base}.left`, r.left, true) +
             sel(`${base}.op`, r.op, cmpOpts) +
             (r.op === "in"
               ? txt(`${base}.right.valuesCsv`, (r.right && r.right.values || []).join("，"), "", "允许的值，逗号分隔")
               : refCtl(`${base}.right`, r.right, true));
    } else if (r.type === "linkCount"){
      body = selT(`${base}.target`, r.target, T) +
             sel(`${base}.link`, r.link, ltOpts) +
             sel(`${base}.dir`, r.dir, [{v:"fwd",l:"正向"},{v:"inv",l:"反向"}]) +
             `<span class="txt">数量</span>` + sel(`${base}.op`, r.op, cmpOpts) + numf(`${base}.n`, r.n);
    } else {
      body = selT(`${base}.a`, r.a, T) + sel(`${base}.link`, r.link, ltOpts) + selT(`${base}.b`, r.b, T) +
             sel(`${base}.expect`, r.expect ? "1" : "0", [{v:"1",l:"存在"},{v:"0",l:"不存在"}]);
    }
    return `<div class="spec">
      <span class="lead">规则</span>
      ${sel(`${base}.type`, r.type, [{v:"compare",l:"属性比较"},{v:"linkCount",l:"链接数量"},{v:"linkExists",l:"链接存在"}])}
      ${body}
      <button class="kill" data-del="rule" data-at="${esc(a.id)}" data-i="${i}">✕</button>
      <span class="gloss" data-gloss="rule.${i}">${esc(describeRule(r, a))}</span>
    </div>`;
  }).join("") || `<p class="note" style="margin-bottom:8px">没有规则 —— 这个操作永远可以提交。</p>`;

  /* 编辑 */
  const editRows = a.edits.map((e,i) => {
    const base = `at.${a.id}.edits.${i}`;
    let body = "";
    if (e.op === "create"){
      const t = OT(e.objectType);
      const assigns = t ? `<div class="prop-assign">${t.props.map(p => {
        const ref = (e.props && e.props[p.id]) || {src:"const", value:""};
        const kinds = [{v:"const",l:"常量"},{v:"param",l:"参数"},{v:"prop",l:"属性"},
                       {v:"calc",l:"计算"},{v:"now",l:"当前时间"},{v:"today",l:"日期"},{v:"newId",l:"主键"}];
        const rp = `${base}.props.${p.id}`;
        let tail = "";
        if (ref.src === "const") tail = txt(`${rp}.value`, ref.value, "s", "值");
        else if (ref.src === "param"){
          const ps = a.params.map(x => ({v:x.id, l:x.cn}));
          tail = ps.length ? sel(`${rp}.param`, ref.param, ps) : `<span class="txt" style="color:var(--bad)">先加参数</span>`;
        } else if (ref.src === "prop"){
          const ty = targetType(ref.of, a);
          const props = ty && OT(ty) ? OT(ty).props.map(x => ({v:x.id, l:x.cn})) : [];
          tail = selT(`${rp}.of`, ref.of, T) + (props.length ? sel(`${rp}.prop`, ref.prop, props) : "");
        } else if (ref.src === "calc"){
          tail = refCtl(`${rp}.a`, ref.a, true) +
                 sel(`${rp}.op`, ref.op, [{v:"*",l:"×"},{v:"+",l:"+"},{v:"-",l:"−"}]) +
                 refCtl(`${rp}.b`, ref.b, true);
        } else if (ref.src === "today"){
          tail = numf(`${rp}.plusDays`, ref.plusDays || 0) + `<span class="txt">天后</span>`;
        }
        return `<span class="k">${esc(p.cn)}</span><span class="v">${sel(`${rp}.src`, ref.src, kinds)}${tail}</span>`;
      }).join("")}</div>` : "";
      body = sel(`${base}.objectType`, e.objectType, otOpts) + assigns;
    } else if (e.op === "modify"){
      const ty = targetType(e.target, a);
      const props = ty && OT(ty) ? OT(ty).props.map(p => ({v:p.id, l:p.cn})) : [];
      body = selT(`${base}.target`, e.target, T) +
             (props.length ? sel(`${base}.prop`, e.prop, props) : `<span class="txt" style="color:var(--bad)">目标无属性</span>`) +
             sel(`${base}.mode`, e.mode, [{v:"set",l:"设为"},{v:"inc",l:"增加"},{v:"dec",l:"减少"},{v:"mul",l:"乘以"}]) +
             refCtl(`${base}.value`, e.value, true);
    } else if (e.op === "link" || e.op === "unlink"){
      body = selT(`${base}.a`, e.a, T) + sel(`${base}.link`, e.link, ltOpts) + selT(`${base}.b`, e.b, T);
    } else {
      body = selT(`${base}.target`, e.target, T);
    }
    const d = describeSpec(e, a);
    return `<div class="spec write">
      <span class="op">${d.op}</span>
      ${sel(`${base}.op`, e.op, [{v:"create",l:"新建对象"},{v:"modify",l:"修改属性"},
                                 {v:"link",l:"建立链接"},{v:"unlink",l:"断开链接"},{v:"delete",l:"删除对象"}])}
      ${body}
      <button class="kill" data-del="edit" data-at="${esc(a.id)}" data-i="${i}">✕</button>
      <span class="gloss" data-gloss="edit.${i}">${esc(d.txt)}</span>
    </div>`;
  }).join("") || `<p class="note" style="margin-bottom:8px">还没有编辑 —— 这个操作什么也不会写。</p>`;

  return `
    <div class="ed">
      <div class="ed-head">
        <div class="obj-kicker">
          <span class="pill" style="color:var(--write);border-color:currentColor">↯ Action Type</span>
        </div>
        <h3><span class="cn-live">${esc(a.cn)}</span> <span class="mono" style="font-size:14px;color:var(--muted)">${esc(a.id)}</span></h3>
      </div>

      <div class="ed-sec">
        <span class="eyebrow">基本信息</span>
        <div class="f-grid">
          <div class="field"><label>中文名</label><input type="text" data-path="at.${esc(a.id)}.cn" value="${esc(a.cn)}"></div>
          <div class="field"><label>API 名 <code>机器用的标识</code></label>
            <input type="text" data-rename="at" data-id="${esc(a.id)}" value="${esc(a.id)}"></div>
        </div>
        <div class="field" style="margin-top:10px"><label>一句话说明</label>
          <input type="text" data-path="at.${esc(a.id)}.desc" value="${esc(a.desc||"")}"></div>
      </div>

      <div class="ed-sec">
        <span class="eyebrow">① 参数 Parameters</span>
        ${paramRows}
        <button class="add" data-add="param" data-at="${esc(a.id)}">+ 添加参数</button>
      </div>

      <div class="ed-sec">
        <span class="eyebrow">② 校验规则 Validation</span>
        ${ruleRows}
        <button class="add" data-add="rule" data-at="${esc(a.id)}">+ 添加规则</button>
        <p class="note" style="margin-top:9px">全部规则通过，提交按钮才会亮 —— 这是本体的完整性防线，不是前端的表单校验。</p>
      </div>

      <div class="ed-sec">
        <span class="eyebrow">③ 写入编辑 Edits</span>
        ${editRows}
        <button class="add" data-add="edit" data-at="${esc(a.id)}">+ 添加编辑</button>
        <p class="note" style="margin-top:9px">目标可以是参数本身，也可以是「参数沿某条链接走一步」得到的对象 —— 一个操作因此能顺着图改到好几个对象。</p>
      </div>
    </div>`;
}

/* --- 建模模式右栏：变更影响 -------------------------------------- */
function usageOf(kind, id){
  const links = [], actions = [];
  if (kind === "ot"){
    for (const l of schema.linkTypes) if (l.from === id || l.to === id) links.push(l.id);
    for (const a of schema.actionTypes){
      const s = JSON.stringify(a);
      if (a.params.some(p => p.objectType === id) || s.includes(`"objectType":"${id}"`)) actions.push(a.id);
    }
    return {links, actions, objects:keysOf(id).length,
            linkRows: world.links.filter(l => { const lt = LTof(l.t); return lt && (lt.from===id||lt.to===id); }).length};
  }
  if (kind === "lt"){
    for (const a of schema.actionTypes) if (JSON.stringify(a).includes(`"${id}"`)) actions.push(a.id);
    return {actions, linkRows: world.links.filter(l => l.t === id).length};
  }
  return {};
}

     <div class="slog">${slog}</div>`;
