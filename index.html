/* ============================================================
   §11  schema 变更 —— 每一次都要把实例数据一起迁移
   ============================================================ */
let draft = {propCn:"", propId:"", propType:"string"};

function uniqueId(base, taken){
  let id = base, i = 2;
  while (taken.includes(id)) id = base + i++;
  return id;
}
const sanitizeId = s => String(s ?? "").trim().replace(/[^A-Za-z0-9_]/g, "");

/* --- 改 API 名 = 一次真正的重命名，所有引用都得跟着走 ---------------
   这正是 API 名与显示名分开的理由：显示名随便改，API 名一改就是破坏性变更。 */
function renameObjectType(oldId, raw){
  const t = OT(oldId); if (!t) return false;
  const newId = sanitizeId(raw);
  if (!newId || newId === oldId) return false;
  if (OT(newId)){ alert(`已经有一个叫 ${newId} 的对象类型了。`); return false; }

  let refs = 0;
  t.id = newId;
  for (const l of schema.linkTypes){
    if (l.from === oldId){ l.from = newId; refs++; }
    if (l.to   === oldId){ l.to   = newId; refs++; }
  }
  for (const a of schema.actionTypes){
    for (const p of a.params) if (p.objectType === oldId){ p.objectType = newId; refs++; }
    for (const e of a.edits)  if (e.op === "create" && e.objectType === oldId){ e.objectType = newId; refs++; }
  }
  // 实例主键的前缀就是类型 API 名 —— 每个对象都要换 key，链接两端也要跟着改
  const remap = {};
  for (const k of Object.keys(world.objects)){
    const o = world.objects[k];
    if (o.type !== oldId) continue;
    const nk = newId + ":" + o.id;
    o.type = newId; remap[k] = nk;
    world.objects[nk] = o; delete world.objects[k]; refs++;
  }
  for (const l of world.links){
    if (remap[l.a]) l.a = remap[l.a];
    if (remap[l.b]) l.b = remap[l.b];
  }
  // 日志里存着撤销用的逆操作，key 不换的话撤销就会落空
  for (const e of logEntries) for (const inv of e.inverse){
    if (inv.key && remap[inv.key]) inv.key = remap[inv.key];
    if (inv.a && remap[inv.a]) inv.a = remap[inv.a];
    if (inv.b && remap[inv.b]) inv.b = remap[inv.b];
    if (inv.objectType === oldId) inv.objectType = newId;
  }
  if (selected && remap[selected]) selected = remap[selected];
  if (layouts.model.has(oldId)){ layouts.model.set(newId, layouts.model.get(oldId)); layouts.model.delete(oldId); }
  for (const [k, nk] of Object.entries(remap))
    if (layouts.operate.has(k)){ layouts.operate.set(nk, layouts.operate.get(k)); layouts.operate.delete(k); }
  if (editing && editing.kind === "ot" && editing.id === oldId) editing.id = newId;
  noteSchema(`对象类型 ${oldId} → ${newId}，同步重写 ${refs} 处引用`);
  return true;
}

function renameLinkType(oldId, raw){
  const l = LTof(oldId); if (!l) return false;
  const newId = sanitizeId(raw);
  if (!newId || newId === oldId) return false;
  if (LTof(newId)){ alert(`已经有一个叫 ${newId} 的链接类型了。`); return false; }

  let refs = 0;
  l.id = newId;
  for (const x of world.links) if (x.t === oldId){ x.t = newId; refs++; }
  // 规则、编辑、以及 hop 目标里都可能按 id 引用这条链接
  const walk = o => {
    if (!o || typeof o !== "object") return;
    if (Array.isArray(o)) return o.forEach(walk);
    for (const k of Object.keys(o)){
      if (k === "link" && o[k] === oldId){ o[k] = newId; refs++; }
      else walk(o[k]);
    }
  };
  for (const a of schema.actionTypes) walk(a);
  if (editing && editing.kind === "lt" && editing.id === oldId) editing.id = newId;
  noteSchema(`链接类型 ${oldId} → ${newId}，同步重写 ${refs} 处引用`);
  return true;
}

function renameActionType(oldId, raw){
  const a = ATof(oldId); if (!a) return false;
  const newId = sanitizeId(raw);
  if (!newId || newId === oldId) return false;
  if (ATof(newId)){ alert(`已经有一个叫 ${newId} 的操作类型了。`); return false; }
  a.id = newId;
  if (activeAction === oldId) activeAction = newId;
  if (editing && editing.kind === "at" && editing.id === oldId) editing.id = newId;
  noteSchema(`操作类型 ${oldId} → ${newId}`);
  return true;
}
const RENAMERS = {ot:renameObjectType, lt:renameLinkType, at:renameActionType};

function newObjectType(){
  const id = uniqueId("NewType", schema.objectTypes.map(t => t.id));
  const t = {id, cn:"新类型", idPrefix:id[0].toUpperCase(), seq:1,
             color:schema.objectTypes.length % 8, titleProp:"name",
             props:[{id:"name", cn:"名称", type:"string"}]};
  schema.objectTypes.push(t);
  noteSchema(`新建对象类型 ${id}`);
  openEditor("ot", id);
}
function newLinkType(){
  if (schema.objectTypes.length < 1) return alert("先建至少一个对象类型。");
  const id = uniqueId("newLink", schema.linkTypes.map(l => l.id));
  const a = schema.objectTypes[0].id;
  const b = (schema.objectTypes[1] || schema.objectTypes[0]).id;
  schema.linkTypes.push({id, from:a, to:b, card:"1 : N", fwd:"关联对象", inv:"来源对象"});
  noteSchema(`新建链接类型 ${id}：${a} → ${b}`);
  openEditor("lt", id);
}
function newActionType(){
  const id = uniqueId("newAction", schema.actionTypes.map(a => a.id));
  schema.actionTypes.push({id, cn:"新操作", uid:uid(), desc:"", params:[], rules:[], edits:[]});
  noteSchema(`新建操作类型 ${id}`);
  openEditor("at", id);
}

function addProp(otId){
  const t = OT(otId); if (!t) return;
  const cn = (draft.propCn || "").trim() || "新属性";
  let id = (draft.propId || "").trim() || "prop";
  id = uniqueId(id.replace(/[^A-Za-z0-9_]/g, ""), t.props.map(p => p.id)) || "prop";
  const p = {id, cn, type:draft.propType};
  if (p.type === "enum") p.options = ["选项一","选项二"];
  t.props.push(p);
  const d = defaultFor(p);
  let n = 0;
  for (const k of keysOf(t.id)){ world.objects[k].props[id] = d; n++; }
  if (!t.props.some(x => x.id === t.titleProp)) t.titleProp = id;
  draft = {propCn:"", propId:"", propType:"string"};
  noteSchema(`${t.id} 新增属性 ${id}，${n} 个实例已补默认值`);
  syncGraph(); renderAll();
}
function delProp(otId, i){
  const t = OT(otId); if (!t || !t.props[i]) return;
  const p = t.props[i];
  t.props.splice(i, 1);
  for (const k of keysOf(t.id)) delete world.objects[k].props[p.id];
  if (t.titleProp === p.id) t.titleProp = t.props[0] ? t.props[0].id : "";
  // 清掉操作里引用这个属性的规则与编辑
  let cut = 0;
  for (const a of schema.actionTypes){
    const before = a.rules.length + a.edits.length;
    a.rules = a.rules.filter(r => !refsProp(r, a, t.id, p.id));
    a.edits = a.edits.filter(e => !(e.op === "modify" && targetType(e.target, a) === t.id && e.prop === p.id));
    for (const e of a.edits) if (e.op === "create" && e.objectType === t.id && e.props) delete e.props[p.id];
    cut += before - (a.rules.length + a.edits.length);
  }
  noteSchema(`${t.id} 删除属性 ${p.id}${cut ? `，连带清理 ${cut} 条规则/编辑` : ""}`);
  syncGraph(); renderAll();
}
function refsProp(rule, action, otId, propId){
  const hit = r => r && r.src === "prop" && r.prop === propId && targetType(r.of, action) === otId;
  return hit(rule.left) || hit(rule.right);
}

function delObjectType(id){
  const u = usageOf("ot", id);
  schema.objectTypes = schema.objectTypes.filter(t => t.id !== id);
  schema.linkTypes = schema.linkTypes.filter(l => l.from !== id && l.to !== id);
  schema.actionTypes = schema.actionTypes.filter(a => !u.actions.includes(a.id));
  for (const k of Object.keys(world.objects)) if (world.objects[k].type === id) delete world.objects[k];
  world.links = world.links.filter(l => world.objects[l.a] && world.objects[l.b] && LTof(l.t));
  noteSchema(`删除对象类型 ${id}：连带 ${u.objects} 个实例、${u.links.length} 个链接类型、${u.actions.length} 个操作类型`);
  editing = null; selected = null;
  layouts.model.clear(); layouts.operate.clear();
  syncGraph(); renderAll();
}
function delLinkType(id){
  const u = usageOf("lt", id);
  schema.linkTypes = schema.linkTypes.filter(l => l.id !== id);
  world.links = world.links.filter(l => l.t !== id);
  for (const a of schema.actionTypes){
    a.rules = a.rules.filter(r => !JSON.stringify(r).includes(`"${id}"`));
    a.edits = a.edits.filter(e => !JSON.stringify(e).includes(`"${id}"`));
  }
  noteSchema(`删除链接类型 ${id}：移除 ${u.linkRows} 条链接`);
  editing = null; syncGraph(); renderAll();
}
function delActionType(id){
  schema.actionTypes = schema.actionTypes.filter(a => a.id !== id);
  noteSchema(`删除操作类型 ${id}`);
  editing = null; renderAll();
}

/* --- 脚手架：一键生成一个可用的 Action ---------------------------- */
function scaffoldCreate(otId){
  const t = OT(otId); if (!t) return;
  const id = uniqueId("create" + t.id, schema.actionTypes.map(a => a.id));
  const eu = uid();
  const params = [], props = {};
  for (const p of t.props){
    if (p.id === t.titleProp || p.type === "string" || p.type === "integer" || p.type === "currency"){
      const pid = uniqueId(p.id, params.map(x => x.id));
      params.push({uid:uid(), id:pid, cn:p.cn,
                   kind: (p.type === "integer" || p.type === "currency") ? "number" : "text",
                   def: (p.type === "integer" || p.type === "currency") ? 0 : ""});
      props[p.id] = {src:"param", param:pid};
    } else if (p.type === "enum"){
      props[p.id] = {src:"const", value:(p.options||[])[0] || ""};
    }
  }
  schema.actionTypes.push({id, cn:`新建${t.cn}`, uid:uid(),
    desc:`创建一个 ${t.cn} 对象。对象只能由 Action 创建 —— 这是本体唯一的写入口。`,
    params, rules:[], edits:[{uid:eu, op:"create", objectType:t.id, props}]});
  noteSchema(`脚手架生成操作 ${id}`);
  openEditor("at", id);
}
function scaffoldLink(ltId){
  const l = LTof(ltId); if (!l) return;
  const id = uniqueId("link" + l.id[0].toUpperCase() + l.id.slice(1), schema.actionTypes.map(a => a.id));
  const A = OT(l.from), B = OT(l.to);
  schema.actionTypes.push({id, cn:`关联${A?A.cn:l.from}与${B?B.cn:l.to}`, uid:uid(),
    desc:`在两个对象之间建立一条 ${l.id} 链接。`,
    params:[{uid:uid(), id:"a", cn:A?A.cn:l.from, kind:"object", objectType:l.from},
            {uid:uid(), id:"b", cn:B?B.cn:l.to,   kind:"object", objectType:l.to}],
    rules:[{uid:uid(), type:"linkExists", a:{kind:"param",param:"a"}, b:{kind:"param",param:"b"},
            link:l.id, expect:false}],
    edits:[{uid:uid(), op:"link", a:{kind:"param",param:"a"}, b:{kind:"param",param:"b"}, link:l.id}]});
  noteSchema(`脚手架生成操作 ${id}`);
  openEditor("at", id);
}

/* --- 新增参数/规则/编辑 ------------------------------------------ */
function addParam(atId){
  const a = ATof(atId); if (!a) return;
  const id = uniqueId("p" + (a.params.length+1), a.params.map(p => p.id));
  const ot = schema.objectTypes[0];
  a.params.push(ot ? {uid:uid(), id, cn:"新参数", kind:"object", objectType:ot.id}
                   : {uid:uid(), id, cn:"新参数", kind:"number", def:0});
  renderAll();
}
function addRule(atId){
  const a = ATof(atId); if (!a) return;
  const T = targetsFor(a);
  const first = T[0];
  const ot = first ? OT(first.objectType) : null;
  a.rules.push(first && ot && ot.props.length
    ? {uid:uid(), type:"compare", left:{src:"prop", of:first.t, prop:ot.props[0].id}, op:"==", right:{src:"const", value:""}}
    : {uid:uid(), type:"compare", left:{src:"const", value:""}, op:"==", right:{src:"const", value:""}});
  renderAll();
}
function addEdit(atId){
  const a = ATof(atId); if (!a) return;
  const T = targetsFor(a);
  a.edits.push(T.length
    ? {uid:uid(), op:"modify", target:T[0].t, prop:(OT(T[0].objectType).props[0]||{}).id, mode:"set", value:{src:"const", value:""}}
    : {uid:uid(), op:"create", objectType:(schema.objectTypes[0]||{}).id, props:{}});
  renderAll();
}

/* ============================================================
   §12  表单写回 —— 用路径把控件值写进 schema
   ============================================================ */
function setByPath(path, raw, isJson, isNum){
  const seg = path.split(".");
  let value = raw;
  if (isJson) { try { value = JSON.parse(raw); } catch { return; } }
  else if (isNum) value = Number(raw);

  if (seg[0] === "draft"){ draft[seg[1]] = value; return; }

  let root = null, rest = null;
  if (seg[0] === "ot"){ root = OT(seg[1]); rest = seg.slice(2); }
  if (seg[0] === "lt"){ root = LTof(seg[1]); rest = seg.slice(2); }
  if (seg[0] === "at"){ root = ATof(seg[1]); rest = seg.slice(2); }
  if (!root) return;

  // 逗号分隔的列表字段
  const last = rest[rest.length-1];
  if (last === "optionsCsv" || last === "valuesCsv"){
    const arr = String(raw).split(/[,，]/).map(s => s.trim()).filter(Boolean);
    let o = root;
    for (let i=0;i<rest.length-1;i++){ if (o[rest[i]] === undefined) o[rest[i]] = {}; o = o[rest[i]]; }
    o[last === "optionsCsv" ? "options" : "values"] = arr;
    return;
  }

  let o = root;
  for (let i=0;i<rest.length-1;i++){ if (o[rest[i]] === undefined) o[rest[i]] = {}; o = o[rest[i]]; }
  const key = rest[rest.length-1];

  if (key === "expect") value = raw === "1";
  if (key === "color" || key === "n" || key === "plusDays") value = Number(raw);

  o[key] = value;
  afterSchemaEdit(seg, rest, key, o, root);
}

/** 结构性字段变了就得把相邻字段拉回一致状态，否则会留下悬空引用 */
function afterSchemaEdit(seg, rest, key, holder, root){
  if (seg[0] === "ot"){
    if (key === "type"){                       // 属性类型换了 → 枚举要有选项，实例值要迁移
      const t = root, p = holder;
      if (p.type === "enum" && !(p.options && p.options.length)) p.options = ["选项一","选项二"];
      if (p.type !== "enum") delete p.options;
      for (const k of keysOf(t.id)){
        const v = world.objects[k].props[p.id];
        if (p.type === "integer" || p.type === "currency"){
          const n = Number(v); world.objects[k].props[p.id] = isFinite(n) ? n : 0;
        } else if (p.type === "boolean") world.objects[k].props[p.id] = !!v;
        else if (p.type === "enum" && !(p.options||[]).includes(v)) world.objects[k].props[p.id] = p.options[0];
        else if (v === undefined) world.objects[k].props[p.id] = defaultFor(p);
      }
      noteSchema(`${t.id}.${p.id} 类型改为 ${p.type}，实例值已迁移`);
    }
  }
  if (seg[0] === "lt"){
    if (key === "from" || key === "to"){       // 两端类型换了 → 不合法的链接必须清掉
      const l = root;
      const before = world.links.length;
      world.links = world.links.filter(x => x.t !== l.id ||
        (get(x.a) && get(x.a).type === l.from && get(x.b) && get(x.b).type === l.to));
      const cut = before - world.links.length;
      if (cut) noteSchema(`${l.id} 端点变更，清理 ${cut} 条不再合法的链接`);
      layouts.model.clear();
    }
  }
  if (seg[0] === "at"){
    const a = root;
    if (key === "kind"){                       // 参数种类换了 → 补齐它需要的字段
      const p = holder;
      if (p.kind === "object" && !p.objectType) p.objectType = (schema.objectTypes[0]||{}).id;
      if (p.kind === "enum" && !(p.options||[]).length) p.options = ["选项一","选项二"];
      if (p.kind === "number" && typeof p.def !== "number") p.def = 0;
    }
    if (key === "type"){                       // 规则类型换了 → 换一套默认字段
      const r = holder, T = targetsFor(a);
      if (r.type === "compare" && !r.left){ r.left = {src:"const", value:""}; r.op = "=="; r.right = {src:"const", value:""}; }
      if (r.type === "linkCount"){ r.target = r.target || (T[0]||{}).t; r.link = r.link || (schema.linkTypes[0]||{}).id;
                                   r.dir = r.dir || "fwd"; r.op = r.op || "=="; r.n = r.n ?? 0; }
      if (r.type === "linkExists"){ r.a = r.a || (T[0]||{}).t; r.b = r.b || (T[1]||T[0]||{}).t;
                                    r.link = r.link || (schema.linkTypes[0]||{}).id; r.expect = r.expect ?? true; }
    }
    if (key === "op" && holder.uid && a.edits.includes(holder)){   // 编辑类型换了
      const e = holder, T = targetsFor(a);
      if (e.op === "create" && !e.objectType){ e.objectType = (schema.objectTypes[0]||{}).id; e.props = {}; }
      if (e.op === "modify" && !e.target){ e.target = (T[0]||{}).t; e.mode = "set"; e.value = {src:"const", value:""};
                                           const ty = targetType(e.target, a); e.prop = ty && OT(ty).props[0] ? OT(ty).props[0].id : ""; }
      if ((e.op === "link" || e.op === "unlink") && !e.link){
        e.a = e.a || (T[0]||{}).t; e.b = e.b || (T[1]||T[0]||{}).t; e.link = (schema.linkTypes[0]||{}).id; }
      if (e.op === "delete" && !e.target) e.target = (T[0]||{}).t;
    }
    if (key === "src"){                        // 值来源换了 → 清掉上一种来源的残留字段
      const r = holder;
      for (const f of ["value","param","of","prop","a","b","op","plusDays","values"]) if (r.src !== "calc" || (f!=="a"&&f!=="b"&&f!=="op")) delete r[f];
      if (r.src === "const") r.value = "";
      if (r.src === "param") r.param = (a.params[0]||{}).id;
      if (r.src === "prop"){ const T = targetsFor(a); r.of = (T[0]||{}).t;
                             const ty = targetType(r.of, a); r.prop = ty && OT(ty).props[0] ? OT(ty).props[0].id : ""; }
      if (r.src === "calc"){ r.a = {src:"const", value:1}; r.op = "*"; r.b = {src:"const", value:1}; }
      if (r.src === "today") r.plusDays = 0;
    }
    if (key === "objectType" && holder.op === "create") holder.props = holder.props || {};
    if (key === "target" || key === "of"){     // 目标换了 → 属性可能不属于新类型了
      const ty = targetType(holder[key], a);
      const props = ty && OT(ty) ? OT(ty).props : [];
      if (holder.prop && !props.some(p => p.id === holder.prop)) holder.prop = props[0] ? props[0].id : "";
    }
  }
}

/* ============================================================
   §13  本体规格 JSON
   ============================================================ */
function openDrawer(){
  drawerOpen = true;
  const box = document.createElement("div");
  box.className = "drawer"; box.id = "drawer";
  box.innerHTML = `
    <div class="drawer-box">
      <div class="drawer-head">
        <h3>本体规格 JSON</h3>
        <button class="ghost" id="drawer-close">关闭</button>
      </div>
      <textarea id="spec-text" spellcheck="false">${esc(JSON.stringify({schema, world}, null, 2))}</textarea>
      <div class="drawer-foot">
        <p class="note">本体就是一份可序列化的规格 —— 类型、链接、操作全在这里。改完贴回去就能生效。</p>
        <button class="ghost" id="spec-apply">应用这份 JSON</button>
      </div>
    </div>`;
  document.body.appendChild(box);
}
function closeDrawer(){
  drawerOpen = false;
  const d = document.getElementById("drawer");
  if (d) d.remove();
}
function applySpec(){
  const ta = document.getElementById("spec-text");
  let parsed;
  try { parsed = JSON.parse(ta.value); }
  catch (e){ alert("JSON 解析失败：" + e.message); return; }
  if (!parsed.schema || !parsed.schema.objectTypes){ alert("缺少 schema.objectTypes。"); return; }
  schema = parsed.schema;
  world = parsed.world || {objects:{}, links:[]};
  logEntries = []; editCount = 0;
  selected = null; editing = null; highlight = null; formState = {};
  layouts.model.clear(); layouts.operate.clear();
  noteSchema("从 JSON 导入了整份本体");
  closeDrawer(); syncGraph(); renderAll();
}

/* ============================================================
   §14  组装
   ============================================================ */
function renderAll(){
  renderConcepts(); renderStats(); renderLeft();
  if (mode === "model"){ renderModelMid(); renderModelRight(); }
  else { renderDetail(); renderRunner(); }
  measureNodes();
}
function select(key){
  selected = key;
  const action = ATof(activeAction);
  const o = get(key);
  if (action && o){
    const slot = action.params.find(p => p.kind === "object" && p.objectType === o.type);
    if (slot) formState[slot.id] = key;
  }
  renderDetail(); renderRunner(); renderLeft(); renderStats(); kick();
}
function openEditor(kind, id){
  if (mode !== "model"){ mode = "model"; syncGraph(); }
  // 刚发生过改名的话，点到的可能是一个已经不存在的旧 id
  const still = kind === "ot" ? OT(id) : kind === "lt" ? LTof(id) : ATof(id);
  editing = still ? {kind, id} : null;
  renderAll(); kick();
}
function setMode(m){
  if (mode === m) return;
  mode = m; highlight = null;
  syncGraph(); renderAll(); kick();
}

document.addEventListener("click", ev => {
  const t = ev.target;
  const hit = s => t.closest(s);

  if (hit("#drawer-close")) return closeDrawer();
  if (hit("#spec-apply"))   return applySpec();
  if (drawerOpen && t.id === "drawer") return closeDrawer();

  const m = hit(".mode");                    if (m) return setMode(m.dataset.mode);
  if (hit("#relayout")) return relayout();
  if (hit("#spec"))     return openDrawer();
  if (hit("#reset"))    { loadDemo(); syncGraph(); renderAll(); return; }
  if (hit("#blank"))    { loadBlank(); mode = "model"; syncGraph(); renderAll(); return; }

  const ed = hit("[data-edit]");              if (ed) return openEditor(ed.dataset.edit, ed.dataset.id);
  const nw = hit("[data-new]");
  if (nw) return nw.dataset.new === "ot" ? newObjectType()
         : nw.dataset.new === "lt" ? newLinkType() : newActionType();

  const add = hit("[data-add]");
  if (add){
    if (add.dataset.add === "prop")  return addProp(add.dataset.ot);
    if (add.dataset.add === "param") return addParam(add.dataset.at);
    if (add.dataset.add === "rule")  return addRule(add.dataset.at);
    if (add.dataset.add === "edit")  return addEdit(add.dataset.at);
  }
  const del = hit("[data-del]");
  if (del){
    const i = Number(del.dataset.i), a = ATof(del.dataset.at);
    if (del.dataset.del === "prop")  return delProp(del.dataset.ot, i);
    if (del.dataset.del === "param" && a){ a.params.splice(i,1); return renderAll(); }
    if (del.dataset.del === "rule"  && a){ a.rules.splice(i,1);  return renderAll(); }
    if (del.dataset.del === "edit"  && a){ a.edits.splice(i,1);  return renderAll(); }
  }
  const dt = hit("[data-del-type]");
  if (dt){
    const id = dt.dataset.id, kind = dt.dataset.delType;
    if (!confirm(`确定删除 ${id}？这会连同相关的实例数据一起移除。`)) return;
    return kind === "ot" ? delObjectType(id) : kind === "lt" ? delLinkType(id) : delActionType(id);
  }
  const sc = hit("[data-scaffold]");
  if (sc) return sc.dataset.scaffold === "ot" ? scaffoldCreate(sc.dataset.id) : scaffoldLink(sc.dataset.id);
  const tryIt = hit("[data-try]");
  if (tryIt){ activeAction = tryIt.dataset.try; formState = {}; mode = "operate"; syncGraph(); renderAll(); return; }

  const hl = hit("[data-hl]");
  if (hl){
    const kind = hl.dataset.hl, id = hl.dataset.id;
    highlight = (highlight && highlight.kind===kind && highlight.id===id) ? null : {kind, id};
    renderLeft(); kick(); return;
  }
  const tab = hit("[data-action]");
  if (tab){ activeAction = tab.dataset.action; formState = {}; renderRunner();
            document.getElementById("col-right").scrollTo({top:0, behavior:"smooth"}); return; }
  const go = hit("[data-goto]");               if (go) return select(go.dataset.goto);
  const run = hit("[data-run]");
  if (run){ activeAction = run.dataset.run; formState = {}; renderRunner();
            document.getElementById("col-right").scrollTo({top:0, behavior:"smooth"}); return; }

  if (hit("#apply")){
    const action = ATof(activeAction); if (!action) return;
    const p = {...formState}; delete p.__action;
    if (evaluate(action, p).valid) runAction(action, p);
    return;
  }
  if (hit("#undo")) return undoLast();
});

/* 运行模式的参数输入：即时重算，并把焦点还回去 */
document.addEventListener("input", ev => {
  const f = ev.target.closest("[data-p]");
  if (f){
    const key = f.dataset.p;
    formState[key] = f.type === "number" ? Number(f.value) : f.value;
    renderRunner();
    const el = document.querySelector(`[data-p="${key}"]`);
    if (el) el.focus();
    return;
  }
  // 建模表单的文本输入：只写值不重绘，避免打字时丢焦点
  const s = ev.target.closest("[data-path]");
  if (s && s.tagName === "INPUT")
    setByPath(s.dataset.path, s.value, s.dataset.json === "1", s.dataset.num === "1");
});

/* 下拉改的是结构，重绘整个编辑器；文本框只刷新派生文字，
   否则用户 Tab 到下一个输入框时，整张表单会在他手里被拆掉重建 */
/* 文本框的 change 是失焦才触发的。如果失焦是因为用户去点别的东西，
   立刻重绘会把他正按着的那个节点换掉，这一下点击就没了。
   所以按住指针期间先把重绘攒着，等点击走完再放。 */
let pointerHeld = false, pendingRender = null;
addEventListener("pointerdown", () => { pointerHeld = true; }, true);
addEventListener("pointerup", () => {
  pointerHeld = false;
  if (pendingRender){ const f = pendingRender; pendingRender = null; setTimeout(f, 0); }
}, true);
function renderSoon(fn){ if (pointerHeld) pendingRender = fn; else fn(); }

document.addEventListener("change", ev => {
  // 改名只在失焦或回车时提交一次 —— 否则每敲一个字母都会重命名一轮
  const rn = ev.target.closest("[data-rename]");
  if (rn){
    if (!RENAMERS[rn.dataset.rename](rn.dataset.id, rn.value)) rn.value = rn.dataset.id;
    renderSoon(() => { syncGraph(); renderAll(); kick(); });
    return;
  }
  const s = ev.target.closest("[data-path]");
  if (!s) return;
  setByPath(s.dataset.path, s.value, s.dataset.json === "1", s.dataset.num === "1");
  if (s.tagName === "SELECT"){ syncGraph(); renderAll(); }
  else renderSoon(refreshDerived);
});

/** 只更新读取自 schema 的展示文字，不碰任何正在编辑的控件 */
function refreshDerived(){
  renderStats(); renderLeft();
  if (mode === "model") renderModelRight();
  const a = editing && editing.kind === "at" ? ATof(editing.id) : null;
  if (a){
    document.querySelectorAll("#mid-body [data-gloss]").forEach(el => {
      const [kind, i] = el.dataset.gloss.split(".");
      const item = kind === "rule" ? a.rules[+i] : a.edits[+i];
      if (item) el.textContent = kind === "rule" ? describeRule(item, a) : describeSpec(item, a).txt;
    });
  }
  const h = document.querySelector("#mid-body .ed-head h3 .cn-live");
  if (h) h.textContent = editing && editing.kind === "at" ? (ATof(editing.id)||{}).cn
                       : editing && editing.kind === "ot" ? (OT(editing.id)||{}).cn : h.textContent;
  syncGraph();
}

/* 回车即提交改名 —— 不然改完名字直接去点别处，那一下点击会被重绘吃掉 */
document.addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  const rn = ev.target.closest("[data-rename]");
  if (!rn) return;
  ev.preventDefault();
  rn.blur();
});

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", refreshTheme);
new MutationObserver(refreshTheme).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

loadDemo();
refreshTheme();
syncGraph();
renderAll();
kick();
</script>
