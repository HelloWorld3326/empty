# 测试夹具：SkillOpt 基础配置的精简版（字段结构与真实仓库一致）
model:
  backend: azure_openai
  optimizer: gpt-5.5
  target: gpt-5.5
  optimizer_backend: fake_exec   # 非 openai_chat/qwen_chat，预检直接通过
  target_backend: fake_exec
  reasoning_effort: medium
  azure_openai_endpoint: ""
  azure_openai_api_key: ""

train:
  num_epochs: 2
  batch_size: 4
  seed: 42

gradient:
  minibatch_size: 2
  analyst_workers: 2

optimizer:
  learning_rate: 4
  lr_scheduler: cosine
  use_slow_update: true
  use_meta_skill: true

evaluation:
  use_gate: true

env:
  name: ""
  skill_init: ""
  out_root: ""
