# 网关需要在沙箱 namespace 里创建/删除 Pod 和执行 exec。
#
# 注意：这个审批在多数公司要走一到两周，**立项当天就去提**，
# 否则它会成为整个项目的工期瓶颈。
#
# 权限刻意收得很窄：只在 agentbase namespace 内，只管 pods，
# 没有 deployments/secrets/nodes 的任何权限。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentbase-gateway
  namespace: agentbase
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentbase-sandbox-manager
  namespace: agentbase
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentbase-sandbox-manager
  namespace: agentbase
subjects:
  - kind: ServiceAccount
    name: agentbase-gateway
    namespace: agentbase
roleRef:
  kind: Role
  name: agentbase-sandbox-manager
  apiGroup: rbac.authorization.k8s.io
